name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: currency_analyzer
          POSTGRES_USER: currency_user
          POSTGRES_PASSWORD: currency_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U currency_user -d currency_analyzer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests and coverage check
        run: ./mvnw verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/currency_analyzer
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: currency_user
          SPRING_DATASOURCE_PASSWORD: currency_password

      - name: Add JaCoCo coverage summary
        if: always()
        run: |
          python3 <<'PY'
          import csv
          from pathlib import Path
          import os

          report = Path("target/site/jacoco/jacoco.csv")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report.exists():
              with summary_path.open("a", encoding="utf-8") as summary:
                  summary.write("## JaCoCo coverage\n\n")
                  summary.write("JaCoCo CSV report was not found.\n")
              raise SystemExit(0)

          instruction_missed = 0
          instruction_covered = 0
          branch_missed = 0
          branch_covered = 0
          line_missed = 0
          line_covered = 0

          with report.open("r", encoding="utf-8") as file:
              reader = csv.DictReader(file)
              for row in reader:
                  instruction_missed += int(row["INSTRUCTION_MISSED"])
                  instruction_covered += int(row["INSTRUCTION_COVERED"])
                  branch_missed += int(row["BRANCH_MISSED"])
                  branch_covered += int(row["BRANCH_COVERED"])
                  line_missed += int(row["LINE_MISSED"])
                  line_covered += int(row["LINE_COVERED"])

          def ratio(covered, missed):
              total = covered + missed
              if total == 0:
                  return 100.0
              return covered / total * 100

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## JaCoCo coverage\n\n")
              summary.write("| Counter | Coverage | Covered | Missed |\n")
              summary.write("| --- | ---: | ---: | ---: |\n")
              summary.write(f"| Instructions | {ratio(instruction_covered, instruction_missed):.2f}% | {instruction_covered} | {instruction_missed} |\n")
              summary.write(f"| Branches | {ratio(branch_covered, branch_missed):.2f}% | {branch_covered} | {branch_missed} |\n")
              summary.write(f"| Lines | {ratio(line_covered, line_missed):.2f}% | {line_covered} | {line_missed} |\n")
          PY

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: target/site/jacoco/
          retention-days: 7