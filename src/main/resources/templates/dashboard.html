<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Currency Analyzer - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div>
        <strong>Currency Analyzer</strong>
    </div>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/settings}">Nastavení</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="link-button">Odhlásit</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="card">
        <h1>Dashboard</h1>
        <p class="muted">Analýza měnových kurzů podle vybrané základní měny.</p>

        <form class="grid-form" method="get" th:action="@{/dashboard}">
            <div>
                <label for="baseCurrency">Základní měna</label>
                <select id="baseCurrency" name="baseCurrency">
                    <option th:text="${baseCurrency}" selected>EUR</option>
                </select>
            </div>

            <div>
                <label for="startDate">Od</label>
                <input id="startDate" name="startDate" type="date" th:value="${startDate}">
            </div>

            <div>
                <label for="endDate">Do</label>
                <input id="endDate" name="endDate" type="date" th:value="${endDate}">
            </div>

            <div class="form-actions">
                <button type="submit">Načíst data</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Vybrané měny</h2>
        <div class="tag-list">
            <span class="tag" th:each="currency : ${selectedCurrencies}" th:text="${currency}">USD</span>
        </div>
    </section>

    <section class="card">
        <h2>Výsledky</h2>
        <table>
            <tbody>
            <tr>
                <th>Nejsilnější měna</th>
                <td th:text="${strongestCurrency}">USD</td>
            </tr>
            <tr>
                <th>Nejslabší měna</th>
                <td th:text="${weakestCurrency}">CZK</td>
            </tr>
            <tr>
                <th>Průměr kurzu</th>
                <td th:text="${averageRate}">1.12</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>Graf</h2>
        <div class="chart-placeholder">
            Graf bude doplněn po implementaci historických dat.
        </div>
    </section>
</main>
</body>
</html>
