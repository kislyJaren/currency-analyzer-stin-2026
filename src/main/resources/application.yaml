spring:
  application:
    name: currency-analyzer

  datasource:
    url: jdbc:h2:file:./data/currency-analyzer
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:password}

  exchange-rate:
    base-url: https://api.exchangerate.host
    access-key: ${EXCHANGE_RATE_API_KEY:}