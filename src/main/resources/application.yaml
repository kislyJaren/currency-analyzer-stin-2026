server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: currency-analyzer

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/currency-analyzer}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  security:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:password}

  exchange-rate:
    base-url: ${EXCHANGE_RATE_BASE_URL:https://api.exchangerate.host}
    access-key: ${EXCHANGE_RATE_API_KEY:}